<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCommerceDashboard</title>

    <!-- CoreUI CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@4.3.0/dist/css/coreui.min.css" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/js/dashboard.js"></script>

    <style>
        .chart-container {
            width: 100%;
            min-height: 400px;
        }
        /* 로딩 렌더링용 스타일 */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 상단 네비게이션바 -->
    <header class="header header-sticky mb-4 px-4 bg-white border-bottom">
        <a class="header-brand" href="#">
            <i class="fa-solid fa-chart-line text-primary me-2"></i>
            <strong>E-Commerce Analytics Dashboard</strong>
        </a>
    </header>

    <div class="body flex-grow-1 px-3">
        <div class="container-lg">

            <!-- 0. 기간 선택 필터 버튼 영역 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0 fw-bold">구매 분석 리포트</h4>
                <div class="btn-group" role="group" aria-label="기간 선택">
                    <button type="button" class="btn btn-outline-primary active" onclick="loadSummary()">load Summary</button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadLinePlot()">load line plot</button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadPieChart()">load pie chart</button>
                </div>
            </div>

            <!-- 1. 주요 지표 요약 카드 (KPI Cards) -->
            <div class="row mb-4">
                <div class="col-sm-6 col-lg-3 mb-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fs-4 fw-semibold" id="kpi-total-sales">-</div>
                                <div>총 매출액</div>
                            </div>
                            <i class="fa-solid fa-sack-dollar fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-3 mb-3">
                    <div class="card text-white bg-info">
                        <div class="card-body pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fs-4 fw-semibold" id="kpi-total-orders">-</div>
                                <div>총 주문 건수</div>
                            </div>
                            <i class="fa-solid fa-cart-shopping fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-3 mb-3">
                    <div class="card text-white bg-warning">
                        <div class="card-body pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fs-4 fw-semibold" id="kpi-customer-count">-</div> <!-- kpi-avg-order -->
                                <div>고객수</div>
                            </div>
                            <i class="fa-solid fa-receipt fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-3 mb-3">
                    <div class="card text-white bg-danger">
                        <div class="card-body pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <div class="fs-4 fw-semibold" id="kpi-top-category">-</div>
                                <div>최다 판매 카테고리</div>
                            </div>
                            <i class="fa-solid fa-fire fa-2x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Plotly 그래프 배치 영역 -->
            <div class="row mb-4 position-relative">
                <!-- 로딩 표시용 스피너 -->
                <div id="loading-spinner" class="loading-overlay d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- 메인 선 그래프 -->
                <div class="col-lg-8 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-white fw-bold">
                            <i class="fa-solid fa-chart-line me-2"></i>Monthly Sales
                        </div>
                        <div class="card-body">
                            <div id="plotly-line-chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>

                <!-- 서브 파이 차트 -->
                <div class="col-lg-4 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-white fw-bold">
                            <i class="fa-solid fa-chart-pie me-2"></i>카테고리별 비중
                        </div>
                        <div class="card-body">
                            <div id="plotly-pie-chart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- CoreUI & JavaScript logic -->
